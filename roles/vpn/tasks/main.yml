---
- name: Require Linux x86-64 binaries on Ubuntu
  ansible.builtin.assert:
    that:
      - ansible_facts.distribution == 'Ubuntu'
      - ansible_facts.architecture == 'x86_64'

- name: Install archive and network tools
  ansible.builtin.apt:
    name: [unzip, ufw, ca-certificates]
    update_cache: true
    cache_valid_time: 3600

- name: Prepare the versioned Xray cache
  ansible.builtin.file:
    path: "/var/cache/portfolio-vpn/{{ vpn_xray_sha256 }}"
    state: directory
    mode: "0755"

- name: Fetch the pinned Xray archive
  ansible.builtin.get_url:
    url: "{{ vpn_xray_url }}"
    dest: "/var/cache/portfolio-vpn/{{ vpn_xray_sha256 }}/xray.zip"
    checksum: "sha256:{{ vpn_xray_sha256 }}"
    mode: "0644"

- name: Extract only the verified Xray executable
  ansible.builtin.unarchive:
    src: "/var/cache/portfolio-vpn/{{ vpn_xray_sha256 }}/xray.zip"
    dest: "/var/cache/portfolio-vpn/{{ vpn_xray_sha256 }}"
    include: [xray]
    remote_src: true
    creates: "/var/cache/portfolio-vpn/{{ vpn_xray_sha256 }}/xray"

- name: Install Xray
  ansible.builtin.copy:
    src: "/var/cache/portfolio-vpn/{{ vpn_xray_sha256 }}/xray"
    dest: /usr/local/bin/portfolio-xray
    remote_src: true
    mode: "0755"
  notify: Restart VPN services

- name: Install the verified Hysteria executable
  ansible.builtin.get_url:
    url: "{{ vpn_hysteria_url }}"
    dest: /usr/local/bin/portfolio-hysteria
    checksum: "sha256:{{ vpn_hysteria_sha256 }}"
    mode: "0755"
  notify: Restart VPN services

- name: Require TLS material and independent client credentials
  ansible.builtin.assert:
    that:
      - vpn_uuid is match('^[a-fA-F0-9]{8}(-[a-fA-F0-9]{4}){3}-[a-fA-F0-9]{12}$')
      - vpn_password | length >= 24
      - vpn_tls_cert is match('^/')
      - vpn_tls_key is match('^/')
      - vpn_port | int >= 1 and vpn_port | int <= 65535
  no_log: true

- name: Create a service account without login access
  ansible.builtin.user:
    name: portfolio-vpn
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Create a protected configuration directory
  ansible.builtin.file:
    path: /etc/portfolio-vpn
    state: directory
    group: portfolio-vpn
    mode: "0750"

- name: Render authenticated server configurations
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/portfolio-vpn/{{ item }}"
    owner: root
    group: portfolio-vpn
    mode: "0640"
  loop: [xray.json, hysteria.yml]
  no_log: true
  notify: Restart VPN services

- name: Install isolated service units
  ansible.builtin.template:
    src: service.j2
    dest: "/etc/systemd/system/portfolio-{{ item }}.service"
    mode: "0644"
  loop: [xray, hysteria]
  notify: Restart VPN services

- name: Apply changed binaries, configurations and units
  ansible.builtin.meta: flush_handlers

- name: Start both VPN services at boot
  ansible.builtin.systemd_service:
    name: "portfolio-{{ item }}.service"
    enabled: true
    state: started
  loop: [xray, hysteria]

- name: Add TCP and UDP ingress rules for externally bound services
  community.general.ufw:
    rule: allow
    port: "{{ vpn_port | string }}"
    proto: "{{ item }}"
  when: vpn_listen not in ['127.0.0.1', '::1']
  loop: [tcp, udp]
