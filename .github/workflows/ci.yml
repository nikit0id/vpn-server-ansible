name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          pip install ansible-core==2.19.15 ansible-lint==26.11.0
          ansible-galaxy collection install -r requirements.yml
          ansible-lint site.yml roles
          ansible-playbook -i localhost, site.yml --syntax-check
          shellcheck scripts/rehearse
      - name: Check both authenticated client tunnels on loopback
        run: scripts/rehearse
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: |
          docker run --rm -v "$PWD:/repo:ro" -w /repo \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo \
            zricethezav/gitleaks:v8.30.0 git . --redact --log-opts=--all
